asyncapi: 3.0.0
info:
  title: SyriusOrbit Fleet Control API - MRIS
  version: 1.0.0
  description: |
    AsyncAPI definition of the SyriusOrbit Fleet Control API over WebSocket.
    This specification models robot-to-enterprise reporting using the MassRobotics
    AMR Interoperability Standard (MRIS), and references canonical payload schemas
    from standards/AMR_Interop_Standard.

    MRIS is complementary to VDA5050:

    1. **VDA5050** handles robot control, scheduling, and fleet messaging between
       the fleet control system and mobile robots.
    2. **MRIS** handles robot-to-enterprise reporting (identity and status) over
       WebSocket, for integration with external enterprise systems (MES/WMS).

    Mobile robots connect to this API as WebSocket clients and publish
    identityReport and statusReport messages to the `/mris/{robotUuid}` channel.
  contact:
    name: SyriusOrbit Maintainers
    url: https://github.com/SyriusOrbit/syrius-orbit-contracts
    email: yukunlin@mail.ustc.edu.cn
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
defaultContentType: application/json
tags:
  - name: fleet-control
    description: SyriusOrbit Fleet Control API.
  - name: mris
    description: MRIS robot-to-enterprise reporting messages.
servers:
  edge:
    host: localhost
    protocol: ws
    description: Edge WebSocket endpoint (no TLS).
  cloud:
    host: mris.cloud.syriusorbit.com
    protocol: wss
    description: Cloud WebSocket endpoint (TLS 1.3 + mTLS + OAuth2).
channels:
  mris:
    address: '/mris/{robotUuid}'
    description: WebSocket channel for MRIS message exchange.
    parameters:
      robotUuid:
        description: RFC 4122 UUID of the AMR.
    messages:
      identityReportMessage:
        $ref: '#/components/messages/identityReportMessage'
      statusReportMessage:
        $ref: '#/components/messages/statusReportMessage'
operations:
  receiveIdentityReport:
    action: receive
    channel:
      $ref: '#/channels/mris'
    summary: Receive identity reports from connected AMRs.
    description: Receive MRIS identity and capability reports from connected AMRs.
    messages:
      - $ref: '#/components/messages/identityReportMessage'
  receiveStatusReport:
    action: receive
    channel:
      $ref: '#/channels/mris'
    summary: Receive status reports from connected AMRs.
    description: Receive MRIS real-time status and location reports from connected AMRs.
    messages:
      - $ref: '#/components/messages/statusReportMessage'
components:
  messages:
    identityReportMessage:
      name: identityReport
      title: MRIS Identity Report
      summary: Robot identity and capability information.
      contentType: application/json
      payload:
        $ref: ./schemas/mris/identityReport.schema.json
      examples:
        - name: Basic Identity Report
          summary: A basic identity report example from MassRobotics standard
          payload:
            uuid: '6948DF80-14BD-4E04-8842-7668D9C001F5'
            timestamp: '2012-04-21T18:25:43-05:00'
            manufacturerName: 'Mass Robotics AMR'
            robotModel: 'AMR-01'
            robotSerialNumber: '0000001'
            baseRobotEnvelope:
              x: 0.5
              y: 1
    statusReportMessage:
      name: statusReport
      title: MRIS Status Report
      summary: Robot real-time status and location.
      contentType: application/json
      payload:
        $ref: ./schemas/mris/statusReport.schema.json
      examples:
        - name: Navigating Status Report
          summary: A status report example with navigation state from MassRobotics standard
          payload:
            uuid: '6948DF80-14BD-4E04-8842-7668D9C001F5'
            timestamp: '2012-04-21T18:25:43-05:00'
            operationalState: 'navigating'
            location:
              x: 0.5
              y: 1
              angle:
                w: 0.924
                x: 0.000
                y: 0.000
                z: 0.383
              planarDatum: '4B8302DA-21AD-401F-AF45-1DFD956B80B5'