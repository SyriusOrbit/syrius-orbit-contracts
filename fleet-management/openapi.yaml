openapi: 3.1.0
info:
  title: SyriusOrbit Fleet Management API
  version: 0.2.0
  description: |-
    OpenAPI definition of the SyriusOrbit Fleet Management API.

    This contract defines the HTTP management surface for fleet operators and
    frontend operators. It 
    exposes near-real-time operational visibility, order
    submission, and predefined instant action control, while execution and
    state propagation remain in the Fleet Control API.

    The API uses site-prefixed routing for resources that are scoped to a
    physical or logical site. Site is a filtering dimension (mutable context
    state), not a namespace identifier. Robots may exist as orphans (no site
    affiliation) for pre-registration, migration preparation, and import
    workflows. Orders and fleet overviews are always site-scoped. Map resources are read-only translation views sourced from
    the Spatial API. Graph and zone set data are nested under map resources.

    Schema and concept compatibility follows VDA 5050 wherever the same
    business object is represented. VDA 5050 MQTT header fields are not
    surfaced on HTTP resources. Robot state views reuse VDA 5050 state field
    names, order payloads reuse the VDA 5050 order shape, and instant actions
    reuse the VDA 5050 action object.

    See `requirements.md` for the full requirement and VDA 5050 mapping
    specification that drives this contract.
  contact:
    name: SyriusOrbit Maintainers
    url: https://github.com/SyriusOrbit/syrius-orbit-contracts
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: /
    description: |-
      Single server entry point. The local edge Daemon and the cloud services
      expose fully consistent interfaces. Transport security differences
      (edge: no TLS, cloud: TLS 1.3 + mTLS + OAuth2 JWT) are handled by the
      runtime, not by this contract.
security: []
tags:
  - name: Robots
    description: Fleet robot inventory, live summaries, factsheet, and instant action control.
  - name: Orders
    description: VDA 5050-aligned order submission, monitoring, and detail views.
  - name: Maps
    description: Map resources and their nested graph and zone set data. Read-only translation views from Spatial API.
  - name: InstantActions
    description: Robot-scoped instant action execution and history.
  - name: Fleet
    description: Fleet-wide operational overview resources.
paths:
  /robots:
    get:
      tags:
        - Robots
      summary: List robots.
      description: |-
        Retrieve the full list of robots currently known to the fleet
        management plane. Supports filtering by site, orphan-only,
        connection state, suspended state, and archived state.
        Non-archived robots are returned by default; use ?archived=true
        to include or retrieve only archived robots. Always returns
        the complete list and does not support pagination.
      operationId: listRobots
      parameters:
        - $ref: '#/components/parameters/siteIdFilter'
        - $ref: '#/components/parameters/unboundFilter'
        - $ref: '#/components/parameters/connectionStateFilter'
        - $ref: '#/components/parameters/suspendedFilter'
        - $ref: '#/components/parameters/archivedFilter'
      responses:
        '200':
          description: Robot list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotList'
              examples:
                sample:
                  value:
                    robots:
                      - robotId: Syrius.SOR-Carrier-001
                        displayName: Carrier 001
                        siteId: site-warehouse-a
                        connectionState: ONLINE
                        operatingMode: AUTOMATIC
                        driving: false
                        paused: false
                        batteryLevel: 87.5
                        charging: false
                        lastUpdatedAt: '2026-07-29T09:30:00Z'
                      - robotId: Syrius.SOR-Carrier-002
                        displayName: Carrier 002
                        siteId: null
                        connectionState: OFFLINE
                        operatingMode: MANUAL
                        driving: false
                        paused: false
                        batteryLevel: 41.0
                        charging: false
                        lastUpdatedAt: '2026-07-29T09:18:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Robots
      summary: Create a robot.
      description: "Create a new robot resource. If siteId is provided in the request body, the robot is immediately affiliated with that site. If siteId is omitted or null, the robot is created as an orphan (unbound). Orphans are valid for pre-registration, migration preparation, and import workflows."
      operationId: createRobot
      requestBody:
        description: Payload for creating a new robot.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotCreateRequest'
            example:
              displayName: Carrier 003
              siteId: site-warehouse-a
              manufacturer: Syrius
              serialNumber: SOR-C-2026-003
      responses:
        '201':
          description: Robot created.
          headers:
            Location:
              description: URL of the created robot resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDetail'
              example:
                robotId: Syrius.SOR-Carrier-003
                displayName: Carrier 003
                siteId: site-warehouse-a
                connectionState: ONLINE
                operatingMode: AUTOMATIC
                driving: false
                paused: false
                batteryLevel: 90.0
                charging: false
                lastUpdatedAt: '2026-07-29T09:45:00Z'
                manufacturer: Syrius
                serialNumber: SOR-Carrier-003
                protocolVersion: 2.0.0
                orderId: ''
                orderUpdateId: 0
                lastNodeId: ''
                lastNodeSequenceId: 0
                nodeStates: []
                edgeStates: []
                actionStates: []
                instantActionStates: []
                powerSupply:
                  stateOfCharge: 90.0
                  charging: false
                safetyState:
                  activeEmergencyStop: NONE
                  fieldViolation: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robots/{robotId}:
    get:
      tags:
        - Robots
      summary: Get a robot.
      description: Retrieve the detail view for a single robot resource, including the complete VDA 5050 state fields plus management metadata.
      operationId: getRobot
      parameters:
        - $ref: '#/components/parameters/robotId'
      responses:
        '200':
          description: Robot detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDetail'
              example:
                robotId: Syrius.SOR-Carrier-001
                displayName: Carrier 001
                siteId: site-warehouse-a
                connectionState: ONLINE
                operatingMode: AUTOMATIC
                driving: false
                paused: false
                batteryLevel: 87.5
                charging: false
                lastUpdatedAt: '2026-07-29T09:30:00Z'
                manufacturer: Syrius
                serialNumber: SOR-Carrier-001
                protocolVersion: 2.0.0
                orderId: order-2026-0001
                orderUpdateId: 3
                lastNodeId: Node-7
                lastNodeSequenceId: 7
                nodeStates: []
                edgeStates: []
                actionStates: []
                instantActionStates: []
                powerSupply:
                  stateOfCharge: 87.5
                  charging: false
                safetyState:
                  activeEmergencyStop: NONE
                  fieldViolation: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Robots
      summary: Update a robot's mutable fields including siteId, suspended, and archived.
      description: |-
        Update a robot's mutable fields. The siteId field can be changed
        to bind an orphan (null→siteId), migrate between sites
        (siteId→siteId), or voluntarily unbind (siteId→null). Robot must
        be idle (no executing order or instant action) to change siteId.

        Set `suspended: true` to temporarily exclude the robot from new
        order assignment while continuing to receive MQTT state messages.

        Set `archived: true` to hide the robot from default listings.
        Archive is irreversible via API — unarchive is not supported.
      operationId: updateRobot
      parameters:
        - $ref: '#/components/parameters/robotId'
      requestBody:
        description: Payload for updating a robot's mutable fields.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotUpdateRequest'
      responses:
        '200':
          description: Robot updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDetail'
              example:
                robotId: Syrius.SOR-Carrier-001
                displayName: Carrier 001
                siteId: site-warehouse-a
                connectionState: ONLINE
                operatingMode: AUTOMATIC
                driving: false
                paused: false
                batteryLevel: 87.5
                charging: false
                lastUpdatedAt: '2026-07-29T09:30:00Z'
                manufacturer: Syrius
                serialNumber: SOR-Carrier-001
                protocolVersion: 2.0.0
                orderId: order-2026-0001
                orderUpdateId: 3
                lastNodeId: Node-7
                lastNodeSequenceId: 7
                nodeStates: []
                edgeStates: []
                actionStates: []
                instantActionStates: []
                powerSupply:
                  stateOfCharge: 87.5
                  charging: false
                safetyState:
                  activeEmergencyStop: NONE
                  fieldViolation: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robots/{robotId}/factsheet:
    get:
      tags:
        - Robots
      summary: Get robot factsheet.
      description: |-
        Retrieve the cached VDA 5050 factsheet for a robot. The factsheet is
        communicated by the mobile robot after a `factsheetRequest` instant
        action is triggered. This endpoint only returns cached data and does
        not trigger a factsheet refresh itself.

        When no cached factsheet is available, the endpoint returns `404` with
        a Problem Details body whose `detail` advises the caller to trigger a
        `factsheetRequest` instant action via
        `POST /robots/{robotId}/instant-actions` and retry later.
      operationId: getRobotFactsheet
      parameters:
        - $ref: '#/components/parameters/robotId'
      responses:
        '200':
          description: Cached factsheet returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FactsheetView'
              example:
                manufacturer: Syrius
                serialNumber: SOR-Carrier-001
                protocolVersion: 2.0.0
                typeSpecification:
                  seriesName: SOR Carrier
                  mobileRobotKinematics: DIFFERENTIAL
                  mobileRobotClass: CARRIER
                  maximumLoadMass: 500
                  localizationTypes:
                    - NATURAL
                  navigationTypes:
                    - FREELY_NAVIGATING
                physicalParameters:
                  minimumSpeed: 0.1
                  maximumSpeed: 1.5
                  maximumAcceleration: 0.5
                  maximumDeceleration: 0.5
                  minimumHeight: 0.3
                  maximumHeight: 1.5
                  width: 0.8
                  length: 1.2
                protocolLimits:
                  maximumStringLengths: {}
                  maximumArrayLengths: {}
                  timing:
                    minimumOrderInterval: 0.1
                    minimumStateInterval: 0.1
                protocolFeatures:
                  optionalParameters: []
                  mobileRobotActions: []
                mobileRobotGeometry: {}
                loadSpecification: {}
                lastUpdatedAt: '2026-07-29T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          description: No cached factsheet is available for the robot.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              examples:
                sample:
                  value:
                    type: 'https://syriusorbit.example/errors/factsheet-not-cached'
                    title: Factsheet not cached
                    status: 404
                    detail: No cached factsheet is available. Trigger a factsheetRequest instant action and retry.
                    instance: 'https://api.syriusorbit.example/robots/Syrius.SOR-Carrier-001/factsheet'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robots/{robotId}/instant-actions:
    get:
      tags:
        - InstantActions
      summary: List instant actions for a robot.
      description: |-
        Retrieve a paginated, filterable history of instant actions
        triggered for a robot, as exposed through the robot state view.
        Non-archived actions are returned by default; use
        ?archived=true to include or retrieve only archived actions.
      operationId: listRobotInstantActions
      parameters:
        - $ref: '#/components/parameters/robotId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/actionTypeFilter'
        - $ref: '#/components/parameters/actionStatusFilter'
        - $ref: '#/components/parameters/lastUpdatedAtFrom'
        - $ref: '#/components/parameters/lastUpdatedAtTo'
        - $ref: '#/components/parameters/archivedFilter'
      responses:
        '200':
          description: Instant action list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantActionList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - InstantActions
      summary: Trigger an instant action for a robot.
      description: |-
        Trigger a single VDA 5050 instant action for the targeted robot. The
        request body carries a single action object without `actionId`; the
        server generates `actionId` and returns the persisted instant action
        with `actionStatus` set to its initial state.

        Predefined actions include `cancelOrder`, `startPause`, `stopPause`,
        `startHibernation`, `stopHibernation`, and `factsheetRequest`.
        Manufacturer-specific actions follow the same action schema.
      operationId: createRobotInstantAction
      parameters:
        - $ref: '#/components/parameters/robotId'
      requestBody:
        description: Payload describing the instant action to issue to the robot.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstantActionCreateRequest'
            examples:
              cancelOrder:
                value:
                  actionType: cancelOrder
                  blockingType: NONE
              factsheetRequest:
                value:
                  actionType: factsheetRequest
                  blockingType: NONE
      responses:
        '201':
          description: Instant action created.
          headers:
            Location:
              description: URL of the created instant action resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantAction'
              example:
                actionId: act-2026-0001
                actionType: cancelOrder
                blockingType: NONE
                actionStatus: WAITING
                robotId: Syrius.SOR-Carrier-001
                createdAt: '2026-07-29T09:30:00Z'
                lastUpdatedAt: '2026-07-29T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /robots/{robotId}/instant-actions/{instantActionId}:
    get:
      tags:
        - InstantActions
      summary: Get an instant action for a robot.
      description: Retrieve the detail of a single instant action from the robot state view.
      operationId: getRobotInstantAction
      parameters:
        - $ref: '#/components/parameters/robotId'
        - $ref: '#/components/parameters/instantActionId'
      responses:
        '200':
          description: Instant action detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantAction'
              example:
                actionId: act-2026-0001
                actionType: cancelOrder
                blockingType: NONE
                actionStatus: FINISHED
                robotId: Syrius.SOR-Carrier-001
                createdAt: '2026-07-29T09:30:00Z'
                lastUpdatedAt: '2026-07-29T09:35:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - InstantActions
      summary: Update an instant action's archived state.
      description: |-
        Update the archived state of an instant action. Only instant
        actions in terminal states (FINISHED, FAILED) can be archived.
        Setting `archived: true` hides the action from default listings
        while keeping it queryable. Archive is irreversible via API.
      operationId: archiveRobotInstantAction
      parameters:
        - $ref: '#/components/parameters/robotId'
        - $ref: '#/components/parameters/instantActionId'
      requestBody:
        description: Payload for updating instant action archive state.
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - archived
              properties:
                archived:
                  type: boolean
                  description: Set to true to archive the instant action.
                  example: true
      responses:
        '200':
          description: Instant action archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantAction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Instant action is not in a terminal state and cannot be archived.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'https://syriusorbit.example/errors/conflict'
                title: Conflict
                status: 409
                detail: Only instant actions in terminal states (FINISHED, FAILED) can be archived.
                instance: 'https://api.syriusorbit.example/robots/Syrius.SOR-Carrier-001/instant-actions/act-2026-0001'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/robots:
    get:
      tags:
        - Robots
      summary: List robots for a specific site.
      description: "List all robots affiliated with the specified site. Equivalent to GET /robots?siteId={siteId}. Does not include orphan robots. Always returns the complete list and does not support pagination."
      operationId: listRobotsAtSite
      parameters:
        - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Robot list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Robots
      summary: Create a robot affiliated with a site.
      description: "Create a new robot resource that is immediately affiliated with the specified site. The siteId is enforced by the path. The robot cannot be created as an orphan via this endpoint."
      operationId: createRobotAtSite
      parameters:
        - $ref: '#/components/parameters/siteId'
      requestBody:
        description: Payload for creating a new robot affiliated with the site.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RobotCreateRequest'
            example:
              displayName: Carrier 004
              siteId: site-warehouse-a
              manufacturer: Syrius
              serialNumber: SOR-C-2026-004
      responses:
        '201':
          description: Robot created.
          headers:
            Location:
              description: URL of the created robot resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RobotDetail'
              example:
                robotId: Syrius.SOR-Carrier-004
                displayName: Carrier 004
                siteId: site-warehouse-a
                connectionState: ONLINE
                operatingMode: AUTOMATIC
                driving: false
                paused: false
                batteryLevel: 95.0
                charging: true
                lastUpdatedAt: '2026-07-29T10:00:00Z'
                manufacturer: Syrius
                serialNumber: SOR-Carrier-004
                protocolVersion: 2.0.0
                orderId: ''
                orderUpdateId: 0
                lastNodeId: ''
                lastNodeSequenceId: 0
                nodeStates: []
                edgeStates: []
                actionStates: []
                instantActionStates: []
                powerSupply:
                  stateOfCharge: 95.0
                  charging: true
                safetyState:
                  activeEmergencyStop: NONE
                  fieldViolation: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders:
    get:
      tags:
        - Orders
      summary: List orders.
      description: |-
        Retrieve a paginated, filterable list of orders tracked by the
        fleet management plane. Supports optional site filtering via
        ?siteId=xxx. Non-archived orders are returned by default; use
        ?archived=true to include or retrieve only archived orders.
      operationId: listOrders
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/orderStatusFilter'
        - $ref: '#/components/parameters/assignedRobotIdFilter'
        - $ref: '#/components/parameters/createdAtFrom'
        - $ref: '#/components/parameters/createdAtTo'
        - $ref: '#/components/parameters/siteIdFilter'
        - $ref: '#/components/parameters/archivedFilter'
      responses:
        '200':
          description: Order list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /orders/{orderId}:
    get:
      tags:
        - Orders
      summary: Get an order.
      description: Retrieve the detail view for a single order, including the complete VDA 5050 order content plus management metadata.
      operationId: getOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              example:
                orderId: order-2026-0001
                orderUpdateId: 0
                orderDescription: Transport order from dock A to zone B.
                nodes:
                  - nodeId: dock-a
                    sequenceId: 0
                    released: true
                    actions: []
                    nodePosition:
                      x: 1.0
                      y: 2.0
                      theta: 0.0
                edges: []
                status: QUEUED
                assignedRobotId: Syrius.SOR-Carrier-001
                createdAt: '2026-07-29T09:00:00Z'
                siteId: site-warehouse-a
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      tags:
        - Orders
      summary: Update an order with incremental VDA 5050 content.
      description: |-
        Append new nodes, edges, and actions to an existing order
        following VDA 5050 additive update semantics. The server
        auto-increments `orderUpdateId` on each successful update.
        Only non-terminal, non-archived orders can be updated.
      operationId: updateOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      requestBody:
        description: Incremental order update payload.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdateRequest'
            example:
              orderDescription: Updated description for transport order.
              nodes:
                - nodeId: zone-b
                  sequenceId: 1
                  released: true
                  actions: []
                  nodePosition:
                    x: 10.0
                    y: 20.0
                    theta: 0.0
      responses:
        '200':
          description: Order updated. The response includes the full order with new `orderUpdateId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              example:
                orderId: order-2026-0001
                orderUpdateId: 1
                orderDescription: Updated description for transport order.
                nodes:
                  - nodeId: dock-a
                    sequenceId: 0
                    released: true
                    actions: []
                    nodePosition:
                      x: 1.0
                      y: 2.0
                      theta: 0.0
                  - nodeId: zone-b
                    sequenceId: 1
                    released: true
                    actions: []
                    nodePosition:
                      x: 10.0
                      y: 20.0
                      theta: 0.0
                edges: []
                status: QUEUED
                assignedRobotId: Syrius.SOR-Carrier-001
                createdAt: '2026-07-29T09:00:00Z'
                siteId: site-warehouse-a
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order is in a terminal state or archived and cannot be updated.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'https://syriusorbit.example/errors/conflict'
                title: Conflict
                status: 409
                detail: Only non-terminal, non-archived orders can be updated.
                instance: 'https://api.syriusorbit.example/orders/order-2026-0001'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Orders
      summary: Archive an order.
      description: |-
        Archive an order. Only orders in terminal states
        (SUCCEEDED, FAILED, CANCELED) can be archived. Archiving hides
        the order from default listings while keeping it queryable.
        Archive is irreversible via API.
      operationId: archiveOrder
      parameters:
        - $ref: '#/components/parameters/orderId'
      responses:
        '200':
          description: Order archived.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Order is not in a terminal state and cannot be archived.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'https://syriusorbit.example/errors/conflict'
                title: Conflict
                status: 409
                detail: Only orders in terminal states (SUCCEEDED, FAILED, CANCELED) can be archived.
                instance: 'https://api.syriusorbit.example/orders/order-2026-0001'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/orders:
    get:
      tags:
        - Orders
      summary: List orders for a specific site.
      description: "List all orders for the specified site. Equivalent to GET /orders?siteId={siteId}."
      operationId: listOrdersAtSite
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/orderStatusFilter'
        - $ref: '#/components/parameters/assignedRobotIdFilter'
        - $ref: '#/components/parameters/createdAtFrom'
        - $ref: '#/components/parameters/createdAtTo'
      responses:
        '200':
          description: Order list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags:
        - Orders
      summary: Create an order for a specific site.
      description: "Submit a new VDA 5050-aligned order for management-side creation in the specified site. The siteId is enforced by the path and is immutable for the lifetime of the order. The assignedRobotId must belong to the same site at execution time."
      operationId: createOrderAtSite
      parameters:
        - $ref: '#/components/parameters/siteId'
      requestBody:
        description: Payload for creating a new VDA 5050-aligned order.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreateRequest'
            example:
              orderDescription: Transport order from dock A to zone B.
              nodes:
                - nodeId: dock-a
                  sequenceId: 0
                  released: true
                  actions: []
                  nodePosition:
                    x: 1.0
                    y: 2.0
                    theta: 0.0
              edges: []
              assignedRobotId: Syrius.SOR-Carrier-001
      responses:
        '201':
          description: Order created.
          headers:
            Location:
              description: URL of the created order resource.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
              example:
                orderId: order-2026-0002
                orderUpdateId: 0
                orderDescription: Transport order from dock A to zone B.
                nodes:
                  - nodeId: dock-a
                    sequenceId: 0
                    released: true
                    actions: []
                    nodePosition:
                      x: 1.0
                      y: 2.0
                      theta: 0.0
                edges: []
                status: QUEUED
                assignedRobotId: Syrius.SOR-Carrier-001
                createdAt: '2026-07-29T09:05:00Z'
                siteId: site-warehouse-a
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps:
    get:
      tags:
        - Maps
      summary: List maps for a site.
      description: Retrieve the full list of maps for the specified site. Read-only translation views from Spatial API. This endpoint always returns the complete list and does not support pagination.
      operationId: listMaps
      parameters:
        - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Map list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Maps
      summary: Create a map.
      description: |-
        Create a new map resource for a site. The map can be created empty
        (no graph or zone set data) or with optional references to Spatial
        API collections that provide the graph and/or zone set data.
      operationId: createMap
      parameters:
        - $ref: '#/components/parameters/siteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MapCreateRequest'
      responses:
        '201':
          description: Map created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Map with the same mapId already exists.
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}:
    get:
      tags:
        - Maps
      summary: Get a map detail.
      description: Retrieve the detail view for a single map resource scoped to a site. Read-only translation view from Spatial API.
      operationId: getMap
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: Map detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapDetail'
              example:
                mapId: map-001
                mapVersion: '1.0'
                mapDescriptor: Warehouse A map
                mapStatus: ENABLED
                siteId: site-warehouse-a
                graph:
                  graphId: graph-001
                  nodeCount: 42
                  edgeCount: 68
                zoneSets:
                  - zoneSetId: zoneset-001
                    zoneSetDescriptor: Warehouse A zone set
                    zoneCount: 12
                lastUpdatedAt: '2026-08-11T10:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}/graph:
    get:
      tags:
        - Maps
      summary: Get the navigation graph for a map.
      description: Retrieve the navigation graph (nodes and edges) for a specific map. Read-only translation view from Spatial API.
      operationId: getGraph
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: Navigation graph returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Graph'
              example:
                nodes:
                  - nodeId: node-001
                    nodePosition:
                      x: 0.0
                      y: 0.0
                      theta: 0.0
                  - nodeId: node-002
                    nodePosition:
                      x: 10.0
                      y: 0.0
                      theta: 0.0
                edges:
                  - edgeId: edge-001
                    startNodeId: node-001
                    endNodeId: node-002
                    length: 10.0
                    maximumSpeed: 1.5
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}/zoneSets:
    get:
      tags:
        - Maps
      summary: List zone sets for a map.
      description: Retrieve the list of zone sets associated with a specific map. Read-only translation views from Spatial API.
      operationId: listZoneSets
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
      responses:
        '200':
          description: Zone set list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneSetList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}/zoneSets/{zoneSetId}:
    get:
      tags:
        - Maps
      summary: Get a zone set detail.
      description: Retrieve the detail view for a single zone set under a specific map. Read-only translation view from Spatial API.
      operationId: getZoneSet
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
        - $ref: '#/components/parameters/zoneSetId'
      responses:
        '200':
          description: Zone set detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneSetDetail'
              example:
                zoneSetId: zoneset-001
                zoneSetDescriptor: Warehouse A zone set
                zones:
                  - zoneId: zone-001
                    zoneType: RELEASE
                    vertices:
                      - x: 0.0
                        y: 0.0
                      - x: 10.0
                        y: 0.0
                      - x: 10.0
                        y: 10.0
                      - x: 0.0
                        y: 10.0
                    zoneSetId: zoneset-001
                    zoneSetDescriptor: Warehouse A zone set
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}/zoneSets/{zoneSetId}/zones:
    get:
      tags:
        - Maps
      summary: List zones under a zone set.
      description: Retrieve a paginated, filterable list of zones under a zone set for a specific map. Read-only translation views from Spatial API.
      operationId: listZones
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
        - $ref: '#/components/parameters/zoneSetId'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/pageSize'
        - $ref: '#/components/parameters/zoneTypeFilter'
      responses:
        '200':
          description: Zone list returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ZoneList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/maps/{mapId}/zoneSets/{zoneSetId}/zones/{zoneId}:
    get:
      tags:
        - Maps
      summary: Get a zone detail.
      description: Retrieve the detail view for a single zone under a zone set for a specific map. Read-only translation view from Spatial API.
      operationId: getZone
      parameters:
        - $ref: '#/components/parameters/siteId'
        - $ref: '#/components/parameters/mapId'
        - $ref: '#/components/parameters/zoneSetId'
        - $ref: '#/components/parameters/zoneId'
      responses:
        '200':
          description: Zone detail returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Zone'
              example:
                zoneId: zone-001
                zoneType: RELEASE
                vertices:
                  - x: 0.0
                    y: 0.0
                  - x: 10.0
                    y: 0.0
                  - x: 10.0
                    y: 10.0
                  - x: 0.0
                    y: 10.0
                zoneSetId: zoneset-001
                zoneSetDescriptor: Warehouse A zone set
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /sites/{siteId}/fleet/overview:
    get:
      tags:
        - Fleet
      summary: Get fleet overview for a site.
      description: Retrieve an aggregated overview of the fleet for a specific site. Site context is required.
      operationId: getSiteFleetOverview
      parameters:
        - $ref: '#/components/parameters/siteId'
      responses:
        '200':
          description: Fleet overview returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FleetOverview'
              examples:
                sample:
                  value:
                    siteId: site-warehouse-a
                    robotCount: 12
                    onlineRobotCount: 10
                    activeOrderCount: 7
                    queuedOrderCount: 5
                    updatedAt: '2026-07-29T09:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    siteId:
      name: siteId
      in: path
      required: true
      description: Unique site identifier. Site is a filtering dimension (mutable context state), not a namespace identifier.
      schema:
        type: string
    siteIdFilter:
      name: siteId
      in: query
      required: false
      description: Filter resources by site identifier.
      schema:
        type: string
    unboundFilter:
      name: unbound
      in: query
      required: false
      description: When true, returns only resources with no site affiliation (orphan robots). Only applicable to robot listing.
      schema:
        type: boolean
    zoneSetId:
      name: zoneSetId
      in: path
      required: true
      description: Unique zone set identifier within a map.
      schema:
        type: string
    robotId:
      name: robotId
      in: path
      required: true
      description: Unique robot identifier, composed as `{manufacturer}.{serialNumber}` (for example `Syrius.SOR-Carrier-001`).
      schema:
        type: string
    orderId:
      name: orderId
      in: path
      required: true
      description: Unique order identifier.
      schema:
        type: string
    mapId:
      name: mapId
      in: path
      required: true
      description: Unique map identifier.
      schema:
        type: string
    zoneId:
      name: zoneId
      in: path
      required: true
      description: Locally unique zone identifier within the map.
      schema:
        type: string
    instantActionId:
      name: instantActionId
      in: path
      required: true
      description: Unique instant action identifier.
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: Zero-based page index. Defaults to `0`.
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    pageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items per page. Defaults to `20`.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 200
        default: 20
    orderStatusFilter:
      name: status
      in: query
      required: false
      description: Filter orders by management status.
      schema:
        $ref: '#/components/schemas/OrderStatus'
    assignedRobotIdFilter:
      name: assignedRobotId
      in: query
      required: false
      description: Filter orders by assigned robot identifier.
      schema:
        type: string
    createdAtFrom:
      name: createdAtFrom
      in: query
      required: false
      description: Inclusive lower bound for order creation time.
      schema:
        type: string
        format: date-time
    createdAtTo:
      name: createdAtTo
      in: query
      required: false
      description: Inclusive upper bound for order creation time.
      schema:
        type: string
        format: date-time
    zoneTypeFilter:
      name: zoneType
      in: query
      required: false
      description: Filter zones by zone type.
      schema:
        $ref: '#/components/schemas/ZoneType'
    actionTypeFilter:
      name: actionType
      in: query
      required: false
      description: Filter instant actions by action type.
      schema:
        type: string
    actionStatusFilter:
      name: actionStatus
      in: query
      required: false
      description: Filter instant actions by action status.
      schema:
        $ref: '#/components/schemas/ActionStatus'
    lastUpdatedAtFrom:
      name: lastUpdatedAtFrom
      in: query
      required: false
      description: Inclusive lower bound for instant action last update time.
      schema:
        type: string
        format: date-time
    lastUpdatedAtTo:
      name: lastUpdatedAtTo
      in: query
      required: false
      description: Inclusive upper bound for instant action last update time.
      schema:
        type: string
        format: date-time
    connectionStateFilter:
      name: connectionState
      in: query
      required: false
      description: Filter robots by connection state.
      schema:
        $ref: '#/components/schemas/ConnectionState'
    suspendedFilter:
      name: suspended
      in: query
      required: false
      description: Filter robots by suspended state. When true, returns only suspended robots. When false, returns only non-suspended robots.
      schema:
        type: boolean
    archivedFilter:
      name: archived
      in: query
      required: false
      description: Filter resources by archived state. When true, returns only archived resources. When false, returns only non-archived resources.
      schema:
        type: boolean

  responses:
    BadRequest:
      description: The request is invalid.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://syriusorbit.example/errors/bad-request'
            title: Bad Request
            status: 400
            detail: The request is invalid.
            instance: 'https://api.syriusorbit.example/robots'
    NotFound:
      description: The requested resource was not found.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://syriusorbit.example/errors/not-found'
            title: Not Found
            status: 404
            detail: The requested resource was not found.
            instance: 'https://api.syriusorbit.example/robots/Syrius.SOR-Carrier-999'
    InternalServerError:
      description: The server failed to process the request.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://syriusorbit.example/errors/internal-server-error'
            title: Internal Server Error
            status: 500
            detail: The server failed to process the request.
            instance: 'https://api.syriusorbit.example/robots'

  schemas:
    Problem:
      type: object
      description: RFC 7807 Problem Details object.
      example:
        type: 'about:blank'
        title: Bad Request
        status: 400
        detail: The request is invalid.
        instance: 'https://api.syriusorbit.example/robots'
      required:
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: URI identifying the problem type.
          example: 'about:blank'
        title:
          type: string
          description: Short human-readable summary of the problem.
          example: Bad Request
        status:
          type: integer
          format: int32
          description: HTTP status code generated by the origin server.
          example: 400
        detail:
          type: string
          description: Human-readable explanation specific to this occurrence.
          example: The request is invalid.
        instance:
          type: string
          format: uri
          description: URI identifying the specific occurrence of the problem.
          example: 'https://api.syriusorbit.example/robots'

    Pagination:
      type: object
      description: Pagination metadata for collection responses.
      example:
        page: 0
        pageSize: 20
        total: 100
      required:
        - page
        - pageSize
        - total
      properties:
        page:
          type: integer
          format: int32
          minimum: 0
        pageSize:
          type: integer
          format: int32
          minimum: 1
        total:
          type: integer
          format: int64
          minimum: 0

    ConnectionState:
      type: string
      description: Connection state between mobile robot and broker, following the VDA 5050 connection schema.
      enum:
        - ONLINE
        - OFFLINE
        - HIBERNATING
        - CONNECTION_BROKEN

    OperatingMode:
      type: string
      description: Current operating mode of the mobile robot, following the VDA 5050 state schema.
      enum:
        - STARTUP
        - AUTOMATIC
        - SEMIAUTOMATIC
        - INTERVENED
        - MANUAL
        - SERVICE
        - TEACH_IN

    OrderStatus:
      type: string
      description: Management-side order status. Conversion timing between states is implementation-defined.
      example: QUEUED
      enum:
        - QUEUED
        - RUNNING
        - SUCCEEDED
        - FAILED
        - CANCELED

    ActionStatus:
      type: string
      description: Action status, following the VDA 5050 action state schema.
      example: RUNNING
      enum:
        - WAITING
        - INITIALIZING
        - RUNNING
        - PAUSED
        - RETRIABLE
        - FINISHED
        - FAILED

    BlockingType:
      type: string
      description: |-
        Regulates whether the action is allowed to execute during movement
        and/or parallel to other actions. Follows the VDA 5050 action schema.
        `NONE`: allows driving and other actions; `SINGLE`: allows driving but
        no other actions; `SOFT`: allows other actions but not driving;
        `HARD`: is the only allowed action at that time.
      enum:
        - NONE
        - SOFT
        - SINGLE
        - HARD

    ZoneType:
      type: string
      description: Zone category, following the VDA 5050 zone set schema.
      example: RELEASE
      enum:
        - BLOCKED
        - LINE_GUIDED
        - RELEASE
        - COORDINATED_REPLANNING
        - SPEED_LIMIT
        - ACTION
        - PRIORITY
        - PENALTY
        - DIRECTED
        - BIDIRECTED

    MapStatus:
      type: string
      description: Status of a map version on the mobile robot, following the VDA 5050 map schema.
      example: ENABLED
      enum:
        - ENABLED
        - DISABLED

    RobotList:
      type: object
      description: A list of robots.
      required:
        - robots
      properties:
        robots:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/RobotSummary'

    RobotSummary:
      type: object
      description: High-frequency query fields for a robot, projected from the VDA 5050 state.
      required:
        - robotId
        - displayName
        - connectionState
        - operatingMode
        - driving
        - paused
        - batteryLevel
        - charging
        - lastUpdatedAt
      properties:
        robotId:
          type: string
          description: Robot identifier composed as `{manufacturer}.{serialNumber}`.
          examples: [Syrius.SOR-Carrier-001]
        displayName:
          type: string
          description: Management-side display name.
          examples: [Carrier 001]
        siteId:
          type: ["string", "null"]
          description: Management-side logical site assignment. Null for orphan robots.
        connectionState:
          $ref: '#/components/schemas/ConnectionState'
        operatingMode:
          $ref: '#/components/schemas/OperatingMode'
        driving:
          type: boolean
          description: True if the mobile robot is driving and/or rotating.
        paused:
          type: boolean
          description: True if the mobile robot is currently in a paused state.
        batteryLevel:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: Battery state of charge in percent, sourced from `state.powerSupply.stateOfCharge`.
          examples: [87.5]
        charging:
          type: boolean
          description: True if charging is in progress, sourced from `state.powerSupply.charging`.
        lastUpdatedAt:
          type: string
          format: date-time
          description: Time the data was last updated, sourced from the VDA 5050 state `timestamp`.
          examples: ['2026-07-29T09:30:00Z']
        suspended:
          type: boolean
          description: |-
            When true, the robot is excluded from new order assignment
            but continues to receive MQTT state messages. Set via
            PATCH. Filterable via `?suspended=true`.
          example: false
        archived:
          type: boolean
          description: |-
            When true, the robot is hidden from default listings
            but remains queryable. Archive is irreversible via API
            — unarchive is not supported. Filterable via
            `?archived=true`. Set via PATCH.
          example: false

    RobotDetail:
      description: |-
        Complete VDA 5050 state fields plus management metadata. The request
        fields (`newBaseRequest`, `zoneRequests`, `edgeRequests`) are exposed
        as read-only observation of the robot's pending control requests.
        The actual grant/revoke responses are handled by the Fleet Control
        API via the `responses` topic and are not in scope of this HTTP API.
      allOf:
        - $ref: '#/components/schemas/RobotSummary'
        - type: object
          required:
            - manufacturer
            - serialNumber
            - protocolVersion
            - orderId
            - orderUpdateId
            - lastNodeId
            - lastNodeSequenceId
            - nodeStates
            - edgeStates
            - actionStates
            - instantActionStates
            - powerSupply
            - safetyState
          properties:
            siteId:
              type: ["string", "null"]
              description: Management-side logical site assignment. Null for orphan robots.
            manufacturer:
              type: string
              description: Manufacturer of the mobile robot, sourced from the VDA 5050 message header.
              examples: [Syrius]
            serialNumber:
              type: string
              description: Serial number of the mobile robot, sourced from the VDA 5050 message header.
              examples: [SOR-Carrier-001]
            protocolVersion:
              type: string
              description: VDA 5050 protocol version, sourced from the VDA 5050 message header `version`.
              examples: [2.0.0]
            orderId:
              type: string
              description: Identifier of the current order or the previous finished order, sourced from `state.orderId`. Empty string if no previous orderId is available.
              examples: [order-2026-0001]
            orderUpdateId:
              type: integer
              format: int64
              minimum: 0
              description: Order update identification of the currently accepted order, sourced from `state.orderUpdateId`. `0` if no previous orderUpdateId is available.
              examples: [3]
            lastNodeId:
              type: string
              description: Node identifier of the last reached node or the current node, sourced from `state.lastNodeId`. Empty string if no lastNodeId is available.
              examples: [Node-7]
            lastNodeSequenceId:
              type: integer
              format: int64
              minimum: 0
              description: Sequence identifier of the last reached node, sourced from `state.lastNodeSequenceId`.
              examples: [7]
            mobileRobotPosition:
              $ref: '#/components/schemas/MobileRobotPosition'
            velocity:
              $ref: '#/components/schemas/Velocity'
            loads:
              type: array
              description: Loads currently handled by the mobile robot, sourced from `state.loads`.
              items:
                $ref: '#/components/schemas/Load'
            nodeStates:
              type: array
              description: Node states that need to be traversed for fulfilling the order, sourced from `state.nodeStates`.
              items:
                $ref: '#/components/schemas/NodeState'
            edgeStates:
              type: array
              description: Edge states that need to be traversed for fulfilling the order, sourced from `state.edgeStates`.
              items:
                $ref: '#/components/schemas/EdgeState'
            actionStates:
              type: array
              description: Current and pending actions, sourced from `state.actionStates`.
              items:
                $ref: '#/components/schemas/ActionState'
            instantActionStates:
              type: array
              description: Instant action states received by the mobile robot, sourced from `state.instantActionStates`.
              items:
                $ref: '#/components/schemas/ActionState'
            zoneActionStates:
              type: array
              description: Zone action states in an end state or currently running, sourced from `state.zoneActionStates`.
              items:
                $ref: '#/components/schemas/ActionState'
            powerSupply:
              $ref: '#/components/schemas/PowerSupply'
            errors:
              type: array
              description: Active errors of the mobile robot, sourced from `state.errors`.
              items:
                $ref: '#/components/schemas/Error'
            information:
              type: array
              description: Information messages from the mobile robot, sourced from `state.information`.
              items:
                $ref: '#/components/schemas/Information'
            safetyState:
              $ref: '#/components/schemas/SafetyState'
            maps:
              type: array
              description: Maps currently stored on the mobile robot, sourced from `state.maps`.
              items:
                $ref: '#/components/schemas/MapSummary'
            zoneSets:
              type: array
              description: Zone sets currently stored on the mobile robot, sourced from `state.zoneSets`.
              items:
                $ref: '#/components/schemas/RobotZoneSetSummary'
            plannedPath:
              $ref: '#/components/schemas/PlannedPath'
            intermediatePath:
              $ref: '#/components/schemas/IntermediatePath'
            distanceSinceLastNode:
              type: number
              format: double
              minimum: 0
              description: Distance the mobile robot has been driving past the `lastNodeId`, in meters. Used by line-guided vehicles, sourced from `state.distanceSinceLastNode`.
            newBaseRequest:
              type: boolean
              description: |-
                True if the mobile robot is almost at the end of the base and will reduce speed if no new base is transmitted. Sourced from `state.newBaseRequest`. Read-only observation; the base update response is handled by the Fleet Control API.
            zoneRequests:
              type: array
              description: Zone requests currently active on the mobile robot, sourced from `state.zoneRequests`. Empty array if no zone requests are active. Read-only observation; grant/revoke responses are handled by the Fleet Control API.
              items:
                $ref: '#/components/schemas/ZoneRequest'
            edgeRequests:
              type: array
              description: Edge requests currently active on the mobile robot, sourced from `state.edgeRequests`. Empty array if no edge requests are active. Read-only observation; grant/revoke responses are handled by the Fleet Control API.
              items:
                $ref: '#/components/schemas/EdgeRequest'

    RobotCreateRequest:
      type: object
      description: Request body for creating a new robot resource.
      required:
        - displayName
      properties:
        displayName:
          type: string
          description: Management-side display name for the robot.
          example: Robot A
        siteId:
          type: ["string", "null"]
          description: Site identifier. Null or omit to create as orphan.
          example: site-001
        manufacturer:
          type: string
          description: Manufacturer of the mobile robot.
          example: Syrius
        serialNumber:
          type: string
          description: Serial number of the mobile robot.
          example: SOR-C-2026-003
        suspended:
          type: boolean
          description: |-
            When true, the robot is excluded from new order assignment
            but continues to receive MQTT state messages. Defaults to
            false on creation.
          default: false
        archived:
          type: boolean
          description: |-
            When true, the robot is hidden from default listings
            but remains queryable. Defaults to false on creation.
            Can only be set to true via PATCH.
          default: false

    RobotUpdateRequest:
      type: object
      description: Request body for updating a robot's mutable fields.
      properties:
        displayName:
          type: string
          description: Management-side display name for the robot.
          example: Robot A
        siteId:
          type: ["string", "null"]
          description: Site identifier. Set to null to make robot an orphan.
          example: site-001
        suspended:
          type: boolean
          description: |-
            When true, the robot is excluded from new order assignment
            but continues to receive MQTT state messages. Set to false
            to resume order acceptance.
          example: false
        archived:
          type: boolean
          description: |-
            When true, the robot is hidden from default listings
            but remains queryable. Archive is irreversible via API
            — unarchive is not supported.
          example: false

    MobileRobotPosition:
      type: object
      description: Position on a map in world coordinates, following the VDA 5050 state schema.
      required:
        - x
        - y
        - theta
        - mapId
        - localized
      properties:
        x:
          type: number
          format: double
          description: X coordinate in meters.
        y:
          type: number
          format: double
          description: Y coordinate in meters.
        theta:
          type: number
          format: double
          minimum: -3.14159265359
          maximum: 3.14159265359
          description: Orientation in radians.
        mapId:
          type: string
          description: Unique identification of the map.
        localized:
          type: boolean
          description: True if the mobile robot is localized and x, y, theta can be trusted.
        localizationScore:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Quality of the localization, optional for vehicles that cannot estimate it.
        deviationRange:
          type: number
          format: float
          minimum: 0
          description: Position deviation range in meters, optional.

    Velocity:
      type: object
      description: Mobile robot velocity in mobile robot coordinates, following the VDA 5050 state schema.
      properties:
        vx:
          type: number
          format: double
          description: Velocity in the x direction in meters per second.
        vy:
          type: number
          format: double
          description: Velocity in the y direction in meters per second.
        omega:
          type: number
          format: double
          description: Turning speed around the z axis in radians per second.

    Load:
      type: object
      description: Load currently handled by the mobile robot, following the VDA 5050 state schema.
      properties:
        loadId:
          type: string
          description: Unique identification number of the load.
        loadType:
          type: string
          description: Type of load.
        loadPosition:
          type: string
          description: Load handling/carrying unit of the mobile robot used for this load.
        boundingBoxReference:
          type: object
          required:
            - x
            - y
            - z
          properties:
            x:
              type: number
              format: double
            y:
              type: number
              format: double
            z:
              type: number
              format: double
            theta:
              type: number
              format: double
              description: Orientation of the load bounding box, important for tugger trains.
        loadDimensions:
          type: object
          required:
            - length
            - width
          properties:
            length:
              type: number
              format: double
              minimum: 0
              description: Absolute length in meters.
            width:
              type: number
              format: double
              minimum: 0
              description: Absolute width in meters.
            height:
              type: number
              format: double
              minimum: 0
              description: Absolute height in meters, optional.
        weight:
          type: number
          format: double
          minimum: 0
          description: Absolute weight of the load in kilograms.

    NodeState:
      type: object
      description: Node state within the current order, following the VDA 5050 state schema.
      required:
        - nodeId
        - sequenceId
        - released
      properties:
        nodeId:
          type: string
        sequenceId:
          type: integer
          format: int64
          minimum: 0
        nodeDescriptor:
          type: string
        released:
          type: boolean
          description: True if the node is part of the base, false if part of the horizon.
        nodePosition:
          type: object
          required:
            - x
            - y
            - mapId
          properties:
            x:
              type: number
              format: double
            y:
              type: number
              format: double
            theta:
              type: number
              format: double
              minimum: -3.14159265359
              maximum: 3.14159265359
            mapId:
              type: string

    EdgeState:
      type: object
      description: Edge state within the current order, following the VDA 5050 state schema.
      required:
        - edgeId
        - sequenceId
        - released
      properties:
        edgeId:
          type: string
        sequenceId:
          type: integer
          format: int64
          minimum: 0
        edgeDescriptor:
          type: string
        released:
          type: boolean
          description: True if the edge is part of the base, false if part of the horizon.
        trajectory:
          $ref: '#/components/schemas/Trajectory'

    ActionState:
      type: object
      description: State of an action, following the VDA 5050 action state schema.
      required:
        - actionId
        - actionStatus
      properties:
        actionId:
          type: string
          description: Unique action identifier.
        actionType:
          type: string
          description: Action type, optional, only for informational or visualization purposes.
        actionDescriptor:
          type: string
          example: Cancel order
        actionStatus:
          $ref: '#/components/schemas/ActionStatus'
        actionResult:
          type: string
          description: Description of the result, errors are transmitted in `errors`.

    PowerSupply:
      type: object
      description: Battery-related information, following the VDA 5050 state schema.
      required:
        - stateOfCharge
        - charging
      properties:
        stateOfCharge:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: State of charge in percent.
        batteryVoltage:
          type: number
          format: double
          description: Battery voltage.
        batteryCurrent:
          type: number
          format: double
          description: Battery current in amperes.
        batteryHealth:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: State of health in percent.
        charging:
          type: boolean
          description: True if charging is in progress.
        range:
          type: number
          format: double
          minimum: 0
          description: Estimated reach with current state of charge in meters.

    Error:
      type: object
      description: Active error of the mobile robot, following the VDA 5050 state schema.
      required:
        - errorType
        - errorLevel
      properties:
        errorType:
          type: string
          description: Error type, extensible enumeration.
        errorReferences:
          type: array
          items:
            type: object
            required:
              - referenceKey
              - referenceValue
            properties:
              referenceKey:
                type: string
                description: Type of reference (for example nodeId, edgeId, orderId, actionId).
              referenceValue:
                type: string
                description: Value belonging to the reference key.
        errorDescription:
          type: string
        errorDescriptionTranslations:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
        errorHint:
          type: string
        errorHintTranslations:
          type: array
          items:
            $ref: '#/components/schemas/Translation'
        errorLevel:
          type: string
          description: |-
            Error level. `WARNING`: no immediate attention required;
            `URGENT`: immediate attention required, mobile robot can continue;
            `CRITICAL`: immediate attention required, mobile robot cannot
            continue the active order; `FATAL`: user intervention is required,
            mobile robot cannot continue or accept new orders.
          enum:
            - WARNING
            - URGENT
            - CRITICAL
            - FATAL

    Translation:
      type: object
      description: Translation of a text for a given language code.
      required:
        - translationKey
        - translationValue
      properties:
        translationKey:
          type: string
          description: Language code according to ISO 639-1.
        translationValue:
          type: string

    Information:
      type: object
      description: Information message from the mobile robot, following the VDA 5050 state schema.
      required:
        - infoType
        - infoLevel
      properties:
        infoType:
          type: string
          description: Type or name of the information.
        infoReferences:
          type: array
          items:
            type: object
            required:
              - referenceKey
              - referenceValue
            properties:
              referenceKey:
                type: string
              referenceValue:
                type: string
        infoDescriptor:
          type: string
        infoLevel:
          type: string
          description: Information level. `DEBUG` for debugging, `INFO` for visualization.
          enum:
            - INFO
            - DEBUG

    SafetyState:
      type: object
      description: Safety-related information, following the VDA 5050 state schema.
      required:
        - activeEmergencyStop
        - fieldViolation
      properties:
        activeEmergencyStop:
          type: string
          description: |-
            Emergency stop type. `MANUAL`: e-stop to be acknowledged manually at
            the mobile robot; `REMOTE`: facility e-stop to be acknowledged
            remotely; `NONE`: no e-stop activated.
          enum:
            - MANUAL
            - REMOTE
            - NONE
        fieldViolation:
          type: boolean
          description: True if the protective field is violated.

    RobotZoneSetSummary:
      type: object
      description: Zone set stored on the mobile robot, following the VDA 5050 state zoneSet schema.
      required:
        - zoneSetId
        - mapId
        - zoneSetStatus
      properties:
        zoneSetId:
          type: string
          description: Unique identifier of the zone set. May be empty if the robot has no zones defined for the map.
        mapId:
          type: string
          description: Identifier of the corresponding map.
        zoneSetStatus:
          type: string
          description: Status of the zone set on the mobile robot.
          enum:
            - ENABLED
            - DISABLED

    PlannedPath:
      type: object
      description: Path within the robot's currently active order, represented as a NURBS trajectory, following the VDA 5050 state schema.
      required:
        - trajectory
      properties:
        trajectory:
          $ref: '#/components/schemas/Trajectory'
        traversedNodes:
          type: array
          description: Node identifiers from the currently executed order that are traversed within the planned path.
          items:
            type: string

    IntermediatePath:
      type: object
      description: Estimated time of arrival at closer waypoints that the mobile robot is able to perceive with its sensors, following the VDA 5050 state schema.
      required:
        - polyline
      properties:
        polyline:
          type: array
          description: Array of endpoints of polyline segments.
          items:
            type: object
            required:
              - x
              - y
              - eta
            properties:
              x:
                type: number
                format: double
                description: X coordinate in meters.
              y:
                type: number
                format: double
                description: Y coordinate in meters.
              theta:
                type: number
                format: double
                minimum: -3.14159265359
                maximum: 3.14159265359
                description: Absolute orientation of the mobile robot in radians.
              eta:
                type: string
                format: date-time
                description: Estimated time of arrival/traversal in ISO 8601 UTC format.

    ZoneRequest:
      type: object
      description: |-
        Zone request sent by the mobile robot to fleet control, following the
        VDA 5050 state schema. Exposed as read-only observation; the
        grant/revoke response is handled by the Fleet Control API via the
        `responses` topic.
      required:
        - requestId
        - requestType
        - zoneId
        - zoneSetId
        - requestStatus
      properties:
        requestId:
          type: string
          description: Unique per mobile robot identifier within all active requests.
        requestType:
          type: string
          description: Type of zone request. `ACCESS` for RELEASE zones, `REPLANNING` for COORDINATED_REPLANNING zones.
          enum:
            - ACCESS
            - REPLANNING
        zoneId:
          type: string
          description: Locally unique identifier within the zone set, referencing the zone the request relates to.
        zoneSetId:
          type: string
          description: Identifier of the zone set, required because `zoneId` is only unique within a zone set.
        requestStatus:
          type: string
          description: |-
            Status of the zone request. `REQUESTED` when initially stated;
            `GRANTED` or `REVOKED` after fleet control response; `EXPIRED`
            when the lease time has passed without response.
          enum:
            - REQUESTED
            - GRANTED
            - REVOKED
            - EXPIRED
        trajectory:
          $ref: '#/components/schemas/Trajectory'

    EdgeRequest:
      type: object
      description: |-
        Edge request sent by the mobile robot to fleet control, following the
        VDA 5050 state schema. Exposed as read-only observation; the
        grant/revoke response is handled by the Fleet Control API via the
        `responses` topic.
      required:
        - requestId
        - requestType
        - edgeId
        - sequenceId
        - requestStatus
      properties:
        requestId:
          type: string
          description: Unique per mobile robot identifier across all active requests.
        requestType:
          type: string
          description: Type of edge request. Currently only `CORRIDOR` is defined.
          enum:
            - CORRIDOR
        edgeId:
          type: string
          description: Globally unique identifier referencing the edge the request relates to.
        sequenceId:
          type: integer
          format: int64
          minimum: 0
          description: Sequence identifier of the edge within the order, required to uniquely identify the referenced edge.
        requestStatus:
          type: string
          description: |-
            Status of the edge request. `REQUESTED` when initially stated;
            `GRANTED` or `REVOKED` after fleet control response; `EXPIRED`
            when the lease time has passed without response.
          enum:
            - REQUESTED
            - GRANTED
            - REVOKED
            - EXPIRED

    FactsheetView:
      type: object
      description: |-
        Management view of the VDA 5050 factsheet. VDA 5050 MQTT transport
        header fields (`headerId`) is not surfaced; `lastUpdatedAt` provides
        the cache freshness timestamp. The protocol version is mapped as
        `protocolVersion`, consistent with the RobotDetail mapping pattern.
        The robot identity fields `manufacturer` and `serialNumber` are
        preserved per the VDA 5050 factsheet schema.
      required:
        - manufacturer
        - serialNumber
        - protocolVersion
        - typeSpecification
        - physicalParameters
        - protocolLimits
        - protocolFeatures
        - mobileRobotGeometry
        - loadSpecification
        - lastUpdatedAt
      properties:
        manufacturer:
          type: string
          description: Manufacturer of the mobile robot, preserved from the VDA 5050 factsheet.
          example: Syrius
        serialNumber:
          type: string
          description: Serial number of the mobile robot, preserved from the VDA 5050 factsheet.
          example: SOR-Carrier-001
        protocolVersion:
          type: string
          description: VDA 5050 protocol version, sourced from the VDA 5050 factsheet message header `version`.
          examples: [2.0.0]
        typeSpecification:
          $ref: '#/components/schemas/TypeSpecification'
        physicalParameters:
          $ref: '#/components/schemas/PhysicalParameters'
        protocolLimits:
          $ref: '#/components/schemas/ProtocolLimits'
        protocolFeatures:
          $ref: '#/components/schemas/ProtocolFeatures'
        mobileRobotGeometry:
          $ref: '#/components/schemas/MobileRobotGeometry'
        loadSpecification:
          $ref: '#/components/schemas/LoadSpecification'
          type: object
          example:
            loadPositions:
              - cargo
            loadSets:
              - setName: standard-cargo
                loadType: CARGO
                loadPositions:
                  - cargo
                boundingBoxReference:
                  x: 0.0
                  y: 0.0
                  z: 0.0
                  theta: 0.0
                loadDimensions:
                  length: 1.2
                  width: 0.8
                  height: 0.5
                maximumWeight: 500
                minimumLoadhandlingHeight: 0.3
                maximumLoadhandlingHeight: 1.5
                minimumLoadhandlingDepth: 0.0
                maximumLoadhandlingDepth: 1.0
                minimumLoadhandlingTilt: 0.0
                maximumLoadhandlingTilt: 0.0
                maximumSpeed: 1.5
                maximumAcceleration: 0.5
                maximumDeceleration: 0.5
                pickTime: 5.0
                dropTime: 5.0
                description: Standard cargo load specification
        mobileRobotConfiguration:
          $ref: '#/components/schemas/MobileRobotConfiguration'
          type: object
          example:
            versions:
              - key: software.version
                value: 2.4.1
            network:
              dnsServers:
                - 10.0.0.10
              ntpServers:
                - 10.0.0.20
              localIpAddress: 192.168.1.50
              netmask: 255.255.255.0
              defaultGateway: 192.168.1.1
            batteryCharging:
              criticalLowChargingLevel: 10
              minimumDesiredChargingLevel: 30
              maximumDesiredChargingLevel: 90
              minimumChargingTime: 1800
        lastUpdatedAt:
          type: string
          format: date-time
          description: Time the factsheet cache was last refreshed.
          example: '2026-07-29T09:30:00Z'

    TypeSpecification:
      type: object
      description: Type specification of the mobile robot, following the VDA 5050 factsheet schema.
      example:
        seriesName: SOR Carrier
        mobileRobotKinematics: DIFFERENTIAL
        mobileRobotClass: CARRIER
        maximumLoadMass: 500
        localizationTypes:
          - NATURAL
        navigationTypes:
          - FREELY_NAVIGATING
      required:
        - seriesName
        - mobileRobotKinematics
        - mobileRobotClass
        - maximumLoadMass
        - localizationTypes
        - navigationTypes
      properties:
        seriesName:
          type: string
        seriesDescription:
          type: string
        mobileRobotKinematics:
          type: string
          description: 'Extensible enumeration. Predefined values: `DIFFERENTIAL`, `OMNIDIRECTIONAL`, `THREE_WHEEL`.'
        mobileRobotClass:
          type: string
          description: 'Extensible enumeration. Predefined values: `FORKLIFT`, `CONVEYOR`, `TUGGER`, `CARRIER`.'
        maximumLoadMass:
          type: number
          format: double
          minimum: 0
          description: Maximum loadable mass in kilograms.
        localizationTypes:
          type: array
          description: 'Extensible enumeration. Predefined values: `NATURAL`, `REFLECTOR`, `RFID`, `DMC`, `SPOT`, `GRID`.'
          items:
            type: string
        navigationTypes:
          type: array
          description: 'List of path planning types supported, sorted by priority. Extensible enumeration. Predefined values: `PHYSICAL_LINE_GUIDED`, `VIRTUAL_LINE_GUIDED`, `FREELY_NAVIGATING`.'
          items:
            type: string
        supportedZones:
          type: array
          items:
            $ref: '#/components/schemas/ZoneType'

    PhysicalParameters:
      type: object
      description: Physical properties of the mobile robot, following the VDA 5050 factsheet schema.
      example:
        minimumSpeed: 0.1
        maximumSpeed: 1.5
        maximumAcceleration: 0.5
        maximumDeceleration: 0.5
        minimumHeight: 0.3
        maximumHeight: 1.5
        width: 0.8
        length: 1.2
      required:
        - minimumSpeed
        - maximumSpeed
        - maximumAcceleration
        - maximumDeceleration
        - minimumHeight
        - maximumHeight
        - width
        - length
      properties:
        minimumSpeed:
          type: number
          format: double
          minimum: 0
          description: Minimal controlled continuous speed in meters per second.
        maximumSpeed:
          type: number
          format: double
          minimum: 0
          description: Maximum speed in meters per second.
        minimumAngularSpeed:
          type: number
          format: double
          minimum: 0
          description: Minimal controlled continuous rotation speed in radians per second.
        maximumAngularSpeed:
          type: number
          format: double
          minimum: 0
          description: Maximum rotation speed in radians per second.
        maximumAcceleration:
          type: number
          format: double
          minimum: 0
          description: Maximum acceleration with maximum load in meters per second squared.
        maximumDeceleration:
          type: number
          format: double
          description: Maximum deceleration with maximum load in meters per second squared.
        minimumHeight:
          type: number
          format: double
          description: Minimum height of the mobile robot in meters.
        maximumHeight:
          type: number
          format: double
          description: Maximum height of the mobile robot in meters.
        width:
          type: number
          format: double
          description: Width of the mobile robot in meters.
        length:
          type: number
          format: double
          description: Length of the mobile robot in meters.

    ProtocolLimits:
      type: object
      description: Protocol limitations of the mobile robot, following the VDA 5050 factsheet schema.
      example:
        maximumStringLengths: {}
        maximumArrayLengths: {}
        timing:
          minimumOrderInterval: 0.1
          minimumStateInterval: 0.1
      required:
        - maximumStringLengths
        - maximumArrayLengths
        - timing
      properties:
        maximumStringLengths:
          type: object
          properties:
            maximumMessageLength:
              type: integer
              format: int64
              minimum: 0
            maximumTopicSerialLength:
              type: integer
              format: int64
              minimum: 0
            maximumTopicElementLength:
              type: integer
              format: int64
              minimum: 0
            maximumIdLength:
              type: integer
              format: int64
              minimum: 0
            idNumericalOnly:
              type: boolean
            maximumLoadIdLength:
              type: integer
              format: int64
              minimum: 0
        maximumArrayLengths:
          type: object
          properties:
            order.nodes:
              type: integer
              format: int64
              minimum: 0
            order.edges:
              type: integer
              format: int64
              minimum: 0
            node.actions:
              type: integer
              format: int64
              minimum: 0
            edge.actions:
              type: integer
              format: int64
              minimum: 0
            actions.actionsParameters:
              type: integer
              format: int64
              minimum: 0
            instantActions:
              type: integer
              format: int64
              minimum: 0
            trajectory.knotVector:
              type: integer
              format: int64
              minimum: 0
            trajectory.controlPoints:
              type: integer
              format: int64
              minimum: 0
            zoneSet.zones:
              type: integer
              format: int64
              minimum: 0
            state.nodeStates:
              type: integer
              format: int64
              minimum: 0
            state.edgeStates:
              type: integer
              format: int64
              minimum: 0
            state.loads:
              type: integer
              format: int64
              minimum: 0
            state.actionStates:
              type: integer
              format: int64
              minimum: 0
            state.instantActionStates:
              type: integer
              format: int64
              minimum: 0
            state.zoneActionStates:
              type: integer
              format: int64
              minimum: 0
            state.errors:
              type: integer
              format: int64
              minimum: 0
            state.information:
              type: integer
              format: int64
              minimum: 0
            error.errorReferences:
              type: integer
              format: int64
              minimum: 0
            information.infoReferences:
              type: integer
              format: int64
              minimum: 0
        timing:
          type: object
          required:
            - minimumOrderInterval
            - minimumStateInterval
          properties:
            minimumOrderInterval:
              type: number
              format: double
              minimum: 0
              description: Minimum interval sending order messages to the mobile robot in seconds.
            minimumStateInterval:
              type: number
              format: double
              minimum: 0
              description: Minimum interval for sending state messages in seconds.
            defaultStateInterval:
              type: number
              format: double
              minimum: 0
              description: Default interval for sending state messages in seconds.
            visualizationInterval:
              type: number
              format: double
              minimum: 0
              description: Default interval for sending messages on the visualization topic in seconds.

    ProtocolFeatures:
      type: object
      description: Supported features of the VDA 5050 protocol, following the VDA 5050 factsheet schema.
      example:
        optionalParameters: []
        mobileRobotActions: []
      required:
        - optionalParameters
        - mobileRobotActions
      properties:
        optionalParameters:
          type: array
          items:
            type: object
            required:
              - parameter
              - support
            properties:
              parameter:
                type: string
                description: Full name of the optional parameter, e.g. `order.nodes.nodePosition.allowedDeviationTheta`.
              support:
                type: string
                enum:
                  - SUPPORTED
                  - REQUIRED
              description:
                type: string
        mobileRobotActions:
          type: array
          items:
            type: object
            required:
              - actionType
              - actionScopes
              - pauseAllowed
              - cancelAllowed
            properties:
              actionType:
                type: string
              actionDescription:
                type: string
              actionScopes:
                type: array
                items:
                  type: string
                  enum:
                    - INSTANT
                    - NODE
                    - EDGE
                    - ZONE
              actionParameters:
                type: array
                items:
                  type: object
                  required:
                    - key
                    - valueDataType
                  properties:
                    key:
                      type: string
                    valueDataType:
                      type: string
                      enum:
                        - BOOL
                        - NUMBER
                        - INTEGER
                        - STRING
                        - OBJECT
                        - ARRAY
                    description:
                      type: string
                    isOptional:
                      type: boolean
              actionResult:
                type: string
              blockingTypes:
                type: array
                items:
                  $ref: '#/components/schemas/BlockingType'
              pauseAllowed:
                type: boolean
              cancelAllowed:
                type: boolean

    MobileRobotGeometry:
      type: object
      description: Mobile robot geometry, following the VDA 5050 factsheet schema.
      example:
        wheelDefinitions:
          - type: DRIVE
            isActiveDriven: true
            isActiveSteered: true
            position:
              x: 0.4
              y: 0.0
            diameter: 0.2
            width: 0.1
      properties:
        wheelDefinitions:
          type: array
          items:
            type: object
            required:
              - type
              - isActiveDriven
              - isActiveSteered
              - position
              - diameter
              - width
            properties:
              type:
                type: string
                description: 'Extensible enumeration. Predefined values: `DRIVE`, `CASTER`, `FIXED`, `MECANUM`.'
              isActiveDriven:
                type: boolean
              isActiveSteered:
                type: boolean
              position:
                type: object
                required:
                  - x
                  - y
                properties:
                  x:
                    type: number
                    format: double
                  y:
                    type: number
                    format: double
                  theta:
                    type: number
                    format: double
              diameter:
                type: number
                format: double
              width:
                type: number
                format: double
              centerDisplacement:
                type: number
                format: double
              constraints:
                type: string
        envelopes2d:
          type: array
          items:
            type: object
            required:
              - envelope2dId
              - vertices
            properties:
              envelope2dId:
                type: string
              vertices:
                type: array
                items:
                  type: object
                  required:
                    - x
                    - y
                  properties:
                    x:
                      type: number
                      format: double
                    y:
                      type: number
                      format: double
              description:
                type: string
        envelopes3d:
          type: array
          items:
            type: object
            required:
              - envelope3dId
              - format
            properties:
              envelope3dId:
                type: string
              format:
                type: string
              data:
                type: object
              url:
                type: string
                format: uri
              description:
                type: string

    LoadSpecification:
      type: object
      description: Abstract specification of load capabilities, following the VDA 5050 factsheet schema.
      properties:
        loadPositions:
          type: array
          items:
            type: string
        loadSets:
          type: array
          items:
            type: object
            required:
              - setName
              - loadType
            properties:
              setName:
                type: string
              loadType:
                type: string
              loadPositions:
                type: array
                items:
                  type: string
              boundingBoxReference:
                type: object
                required:
                  - x
                  - y
                  - z
                properties:
                  x:
                    type: number
                    format: double
                  y:
                    type: number
                    format: double
                  z:
                    type: number
                    format: double
                  theta:
                    type: number
                    format: double
              loadDimensions:
                type: object
                required:
                  - length
                  - width
                properties:
                  length:
                    type: number
                    format: double
                  width:
                    type: number
                    format: double
                  height:
                    type: number
                    format: double
              maximumWeight:
                type: number
                format: double
                minimum: 0
                description: Maximum weight of load type in kilograms.
              minimumLoadhandlingHeight:
                type: number
                format: double
                minimum: 0
              maximumLoadhandlingHeight:
                type: number
                format: double
                minimum: 0
              minimumLoadhandlingDepth:
                type: number
                format: double
              maximumLoadhandlingDepth:
                type: number
                format: double
              minimumLoadhandlingTilt:
                type: number
                format: double
              maximumLoadhandlingTilt:
                type: number
                format: double
              maximumSpeed:
                type: number
                format: double
                minimum: 0
              maximumAcceleration:
                type: number
                format: double
                minimum: 0
              maximumDeceleration:
                type: number
                format: double
                minimum: 0
              pickTime:
                type: number
                format: double
                minimum: 0
                description: Approximate time for picking up the load in seconds.
              dropTime:
                type: number
                format: double
                minimum: 0
                description: Approximate time for dropping the load in seconds.
              description:
                type: string

    MobileRobotConfiguration:
      type: object
      description: Mobile robot configuration, following the VDA 5050 factsheet schema.
      properties:
        versions:
          type: array
          items:
            type: object
            required:
              - key
              - value
            properties:
              key:
                type: string
              value:
                type: string
        network:
          type: object
          properties:
            dnsServers:
              type: array
              items:
                type: string
            ntpServers:
              type: array
              items:
                type: string
            localIpAddress:
              type: string
            netmask:
              type: string
            defaultGateway:
              type: string
        batteryCharging:
          type: object
          properties:
            criticalLowChargingLevel:
              type: number
              format: float
              minimum: 0
              maximum: 100
            minimumDesiredChargingLevel:
              type: number
              format: float
              minimum: 0
              maximum: 100
            maximumDesiredChargingLevel:
              type: number
              format: float
              minimum: 0
              maximum: 100
            minimumChargingTime:
              type: number
              format: double
              minimum: 0
              description: Desired minimum charging time in seconds.

    OrderList:
      type: object
      description: A paginated list of orders.
      required:
        - orders
        - pagination
      properties:
        orders:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/OrderSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'

    OrderSummary:
      type: object
      description: |-
        Management-side summary of an order. Includes management metadata and
        node, edge, and action counts for quick visualization, without
        surfacing the full VDA 5050 `nodes`, `edges`, and `actions` arrays.
      required:
        - orderId
        - orderUpdateId
        - status
        - assignedRobotId
        - createdAt
        - siteId
      properties:
        orderId:
          type: string
          description: VDA 5050 order identifier.
          examples: [order-2026-0001]
        orderUpdateId:
          type: integer
          format: int64
          minimum: 0
          description: VDA 5050 order update identifier.
          examples: [3]
        orderDescription:
          type: string
          description: Additional human-readable information for visualization purposes only.
          example: Transport order from dock A to zone B.
        status:
          $ref: '#/components/schemas/OrderStatus'
        assignedRobotId:
          type: string
          description: Identifier of the robot assigned to execute the order.
          examples: [Syrius.SOR-Carrier-001]
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp.
          examples: ['2026-07-29T09:00:00Z']
        siteId:
          type: string
          description: Site identifier. Immutable for the lifetime of the order.
          examples: [site-warehouse-a]
        nodeCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of nodes in the order.
        edgeCount:
          type: integer
          format: int64
          minimum: 0
          description: Number of edges in the order.
        actionCount:
          type: integer
          format: int64
          minimum: 0
          description: Total number of actions across all nodes and edges.

    OrderDetail:
      type: object
      description: |-
        Complete VDA 5050 order content plus management metadata. The
        underlying `orderId`, `orderUpdateId`, `nodes`, `edges`, and `actions`
        fields remain fully VDA 5050-compatible.
      required:
        - orderId
        - orderUpdateId
        - nodes
        - edges
        - status
        - assignedRobotId
        - createdAt
        - siteId
      properties:
        orderId:
          type: string
          description: VDA 5050 order identifier.
          examples: [order-2026-0001]
        orderUpdateId:
          type: integer
          format: int64
          minimum: 0
          description: VDA 5050 order update identifier. `0` for a newly created order.
          examples: [0]
        orderDescription:
          type: string
          description: Additional human-readable information for visualization purposes only.
          example: Transport order from dock A to zone B.
        nodes:
          type: array
          description: Array of nodes to be traversed for fulfilling the order.
          minItems: 1
          example:
            - nodeId: dock-a
              sequenceId: 0
              released: true
              actions: []
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          description: Array of edges to be traversed for fulfilling the order. May be empty if the order contains a single node.
          example: []
          items:
            $ref: '#/components/schemas/Edge'
        status:
          $ref: '#/components/schemas/OrderStatus'
        assignedRobotId:
          type: string
          description: Identifier of the robot assigned to execute the order.
          examples: [Syrius.SOR-Carrier-001]
        createdAt:
          type: string
          format: date-time
          description: Order creation timestamp.
          examples: ['2026-07-29T09:00:00Z']
        siteId:
          type: string
          description: Site identifier. Immutable for the lifetime of the order.
          examples: [site-warehouse-a]
        archived:
          type: boolean
          description: |-
            When true, the order is hidden from default listings but
            remains queryable. Only orders in terminal states
            (SUCCEEDED, FAILED, CANCELED) can be archived. Archive
            is irreversible via API — unarchive is not supported.
            Filterable via `?archived=true`. Set via
            `POST /orders/{orderId}/archive`.
          example: false

    OrderCreateRequest:
      type: object
      description: |-
        Request body for creating a new order. Carries the VDA 5050 order
        content plus the management-side `assignedRobotId`. The server injects
        `orderId` and `orderUpdateId` set to `0` for a new order.
      required:
        - nodes
        - edges
        - assignedRobotId
      properties:
        orderDescription:
          type: string
          description: Additional human-readable information for visualization purposes only.
          example: Transport order from dock A to zone B.
        nodes:
          type: array
          minItems: 1
          example:
            - nodeId: dock-a
              sequenceId: 0
              released: true
              actions: []
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/Edge'
        assignedRobotId:
          type: string
          description: Identifier of the robot assigned to execute the order.
          examples: [Syrius.SOR-Carrier-001]

    OrderUpdateRequest:
      type: object
      description: |-
        Request body for updating an existing order. Follows VDA 5050
        additive update semantics — new nodes and edges are appended to
        the existing order content. The server auto-increments
        `orderUpdateId` on each successful update.
      properties:
        orderDescription:
          type: string
          description: Updated human-readable description for the order.
          example: Updated description for transport order.
        nodes:
          type: array
          description: Nodes to append to the existing order.
          example:
            - nodeId: zone-b
              sequenceId: 1
              released: true
              actions: []
              nodePosition:
                x: 10.0
                y: 20.0
                theta: 0.0
          items:
            $ref: '#/components/schemas/Node'
        edges:
          type: array
          description: Edges to append to the existing order.
          example: []
          items:
            $ref: '#/components/schemas/Edge'

    Node:
      type: object
      description: Node of an order, following the VDA 5050 order schema.
      required:
        - nodeId
        - sequenceId
        - released
        - actions
      properties:
        nodeId:
          type: string
        sequenceId:
          type: integer
          format: int64
          minimum: 0
        nodeDescriptor:
          type: string
        released:
          type: boolean
          description: True if the node is part of the base, false if part of the horizon.
        nodePosition:
          $ref: '#/components/schemas/NodePosition'
        actions:
          type: array
          description: |-
            Actions to be executed on the node. Per the VDA 5050 order schema,
            each action must include an `actionId` (caller-provided, suggested
            format: UUID).
          items:
            $ref: '#/components/schemas/Action'

    Edge:
      type: object
      description: Edge of an order, following the VDA 5050 order schema.
      required:
        - edgeId
        - sequenceId
        - released
        - actions
      properties:
        edgeId:
          type: string
        sequenceId:
          type: integer
          format: int64
          minimum: 0
        edgeDescriptor:
          type: string
        released:
          type: boolean
          description: True if the edge is part of the base, false if part of the horizon.
        maximumSpeed:
          type: number
          format: double
          description: Permitted maximum speed on the edge in meters per second.
        maximumMobileRobotHeight:
          type: number
          format: double
          description: Permitted maximum height of the mobile robot including load in meters.
        minimumLoadHandlingDeviceHeight:
          type: number
          format: double
          description: Permitted minimal height of the load handling device in meters.
        orientation:
          type: number
          format: double
          minimum: -3.14159265359
          maximum: 3.14159265359
          description: Orientation of the mobile robot on the edge in radians.
        orientationType:
          type: string
          description: How `orientation` is interpreted. Defaults to `TANGENTIAL`.
          enum:
            - GLOBAL
            - TANGENTIAL
        direction:
          type: string
          description: Direction at junctions for line-guided or wire-guided mobile robots.
        reachOrientationBeforeEntering:
          type: boolean
          description: True if the desired edge orientation shall be reached before entering the edge. Defaults to false.
        maxRotationSpeed:
          type: number
          format: double
          description: Maximum rotation speed in radians per second.
        trajectory:
          $ref: '#/components/schemas/Trajectory'
        length:
          type: number
          format: double
          description: Distance of the path from start node to end node in meters.
        corridor:
          $ref: '#/components/schemas/Corridor'
        actions:
          type: array
          description: |-
            Actions to be executed on the edge. Per the VDA 5050 order schema,
            each action must include an `actionId` (caller-provided, suggested
            format: UUID).
          items:
            $ref: '#/components/schemas/Action'

    NodePosition:
      type: object
      description: Position on a map, following the VDA 5050 order nodePosition schema.
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: double
          description: X position in meters.
        y:
          type: number
          format: double
          description: Y position in meters.
        theta:
          type: number
          format: double
          minimum: -3.14159265359
          maximum: 3.14159265359
          description: Absolute orientation of the mobile robot on the node in radians. Optional.
        allowedDeviationXY:
          type: object
          required:
            - a
            - b
            - theta
          properties:
            a:
              type: number
              format: double
              minimum: 0
              description: Length of the ellipse semi-major axis in meters.
            b:
              type: number
              format: double
              minimum: 0
              description: Length of the ellipse semi-minor axis in meters.
            theta:
              type: number
              format: double
              minimum: -1.570796327
              maximum: 1.570796327
              description: Rotation angle in radians.
        allowedDeviationTheta:
          type: number
          format: double
          minimum: 0
          maximum: 3.141592654
          description: Allowed deviation of the theta angle in radians.

    Action:
      type: object
      description: VDA 5050 action object.
      required:
        - actionType
        - blockingType
      properties:
        actionId:
          type: string
          description: 'Unique action identifier. Server-generated when omitted by the client on instant action creation. Suggested format: UUID.'
        actionType:
          type: string
          description: Name of the action. Identifies the function of the action.
        actionDescriptor:
          type: string
          example: Cancel order
        blockingType:
          $ref: '#/components/schemas/BlockingType'
        actionParameters:
          type: array
          items:
            $ref: '#/components/schemas/ActionParameter'
        retriable:
          type: boolean
          description: True if the action can enter the RETRIABLE state when it fails. Defaults to false.

    ActionParameter:
      type: object
      description: VDA 5050 action parameter.
      required:
        - key
        - value
      properties:
        key:
          type: string
          description: Key of the action parameter.
        value:
          description: Value of the action parameter. May be a boolean, number, integer, string, array, or object.
          oneOf:
            - type: boolean
            - type: number
              format: double
            - type: integer
              format: int64
            - type: string
            - type: array
              items:
                type: string
            - type: object

    Trajectory:
      type: object
      description: NURBS trajectory, following the VDA 5050 schema.
      required:
        - controlPoints
      properties:
        degree:
          type: integer
          format: int32
          minimum: 1
          description: Degree of the NURBS curve. Defaults to `1` when not defined.
        knotVector:
          type: array
          items:
            type: number
            format: double
            minimum: 0
            maximum: 1
        controlPoints:
          type: array
          items:
            type: object
            required:
              - x
              - y
            properties:
              x:
                type: number
                format: double
              y:
                type: number
                format: double
              weight:
                type: number
                format: double
                description: Weight of the control point. Defaults to `1.0` when not defined.

    Corridor:
      type: object
      description: Corridor boundaries, following the VDA 5050 order schema.
      required:
        - leftWidth
        - rightWidth
      properties:
        leftWidth:
          type: number
          format: double
          minimum: 0
          description: Width of the corridor to the left of the trajectory in meters.
        rightWidth:
          type: number
          format: double
          minimum: 0
          description: Width of the corridor to the right of the trajectory in meters.
        corridorReferencePoint:
          type: string
          description: Whether the boundaries apply to the kinematic center or the contour of the mobile robot.
          enum:
            - KINEMATIC_CENTER
            - CONTOUR
        releaseRequired:
          type: boolean
          description: True if the robot must request approval from fleet control. Defaults to false.
        releaseLossBehavior:
          type: string
          description: Behavior of the robot if its corridor release expires or is revoked. Defaults to `STOP`.
          enum:
            - STOP
            - RETURN

    InstantActionList:
      type: object
      description: A paginated list of instant actions.
      required:
        - instantActions
        - pagination
      properties:
        instantActions:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/InstantAction'
        pagination:
          $ref: '#/components/schemas/Pagination'

    InstantActionCreateRequest:
      type: object
      description: |-
        Request body for triggering a single instant action. Carries a single
        VDA 5050 action object without `actionId`; the server generates
        `actionId` and returns the persisted instant action.
      required:
        - actionType
        - blockingType
      properties:
        actionType:
          type: string
          description: |-
            Name of the instant action. Predefined actions include
            `cancelOrder`, `startPause`, `stopPause`, `startHibernation`,
            `stopHibernation`, and `factsheetRequest`. Manufacturer-specific
            actions follow the same schema.
          examples: [cancelOrder]
        actionDescriptor:
          type: string
          example: Cancel order
        blockingType:
          type: string
          example: NONE
          description: |-
            Blocking type of the instant action. Following the VDA 5050
            instantActions schema, the blocking type of an instant action is
            always `NONE`: the action can happen in parallel with others,
            including movement.
          enum:
            - NONE
        actionParameters:
          type: array
          example:
            - key: orderId
              value: order-2026-0001
          items:
            $ref: '#/components/schemas/ActionParameter'
        retriable:
          type: boolean
          description: True if the action can enter the RETRIABLE state when it fails. Defaults to false.
          example: false

    InstantAction:
      type: object
      description: Persisted instant action with server-generated `actionId` and current `actionStatus`.
      required:
        - actionId
        - actionType
        - blockingType
        - actionStatus
        - robotId
        - createdAt
        - lastUpdatedAt
      properties:
        actionId:
          type: string
          description: Server-generated unique action identifier.
          example: act-2026-0001
        actionType:
          type: string
          example: cancelOrder
        actionDescriptor:
          type: string
          example: Cancel order
        blockingType:
          type: string
          example: NONE
          description: |-
            Blocking type of the instant action. Following the VDA 5050
            instantActions schema, the blocking type of an instant action is
            always `NONE`.
          enum:
            - NONE
        actionParameters:
          type: array
          example:
            - key: orderId
              value: order-2026-0001
          items:
            $ref: '#/components/schemas/ActionParameter'
        retriable:
          type: boolean
          example: false
        actionStatus:
          $ref: '#/components/schemas/ActionStatus'
        actionResult:
          type: string
          description: Description of the result, errors are transmitted in the robot `errors` array.
          example: Order canceled successfully.
        robotId:
          type: string
          description: Robot targeted by the instant action.
          examples: [Syrius.SOR-Carrier-001]
        siteId:
          type: ["string", "null"]
          description: Site context at creation time.
          example: site-warehouse-a
        createdAt:
          type: string
          format: date-time
          description: Instant action creation timestamp.
          example: '2026-07-29T09:30:00Z'
        lastUpdatedAt:
          type: string
          format: date-time
          description: Time the instant action was last updated.
          example: '2026-07-29T09:35:00Z'
        archived:
          type: boolean
          description: |-
            When true, the instant action is hidden from default
            listings but remains queryable. Only instant actions in
            terminal states (FINISHED, FAILED) can be archived. Archive
            is irreversible via API — unarchive is not supported.
            Filterable via `?archived=true`. Set via PATCH.
          example: false

    MapList:
      type: object
      description: A list of maps.
      required:
        - maps
      properties:
        maps:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/MapSummary'

    MapSummary:
      type: object
      description: Map stored on the mobile robot, following the VDA 5050 state map schema.
      required:
        - mapId
        - mapVersion
        - mapStatus
        - siteId
      properties:
        mapId:
          type: string
        mapVersion:
          type: string
        mapDescriptor:
          type: string
          description: User-defined, human-readable name or descriptor.
        mapStatus:
          $ref: '#/components/schemas/MapStatus'
        siteId:
          type: string
          description: Site identifier.

    MapCreateRequest:
      type: object
      description: Request body for creating a new map.
      required:
        - mapId
        - mapVersion
      properties:
        mapId:
          type: string
          description: Unique map identifier.
        mapVersion:
          type: string
          description: Map version.
        mapDescriptor:
          type: string
          description: User-defined, human-readable name or descriptor.
        mapStatus:
          $ref: '#/components/schemas/MapStatus'
        graphSource:
          type: string
          description: Optional reference to a Spatial API collection for the navigation graph data.
        zoneSetSource:
          type: string
          description: Optional reference to a Spatial API collection for the zone set data.

    MapDetail:
      description: |-
        Detail view for a map, extending MapSummary with graph and zone set
        summaries and last-updated timestamp.
      allOf:
        - $ref: '#/components/schemas/MapSummary'
        - type: object
          properties:
            graph:
              type: object
              description: Summary of the associated navigation graph.
              properties:
                graphId:
                  type: string
                  description: Unique navigation graph identifier.
                nodeCount:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Number of nodes in the navigation graph.
                edgeCount:
                  type: integer
                  format: int64
                  minimum: 0
                  description: Number of edges in the navigation graph.
            zoneSets:
              type: array
              description: Zone sets associated with this map.
              items:
                type: object
                properties:
                  zoneSetId:
                    type: string
                    description: Unique identifier of the zone set.
                  zoneSetDescriptor:
                    type: string
                    description: Human-readable name or descriptor.
                  zoneCount:
                    type: integer
                    format: int64
                    minimum: 0
                    description: Number of zones in the zone set.
            lastUpdatedAt:
              type: string
              format: date-time
              description: Time the map was last updated.

    Graph:
      type: object
      description: |-
        Navigation graph part of a map, sourced from the Spatial API. Node
        and edge fields stay aligned with VDA 5050 order and state terminology.
      required:
        - nodes
        - edges
      properties:
        nodes:
          type: array
          description: Graph nodes, aligned with VDA 5050 node terminology.
          example: []
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          description: Graph edges, aligned with VDA 5050 edge terminology.
          example:
            - edgeId: edge-001
              startNodeId: node-001
              endNodeId: node-002
          items:
            $ref: '#/components/schemas/GraphEdge'

    GraphNode:
      type: object
      description: A node within a navigation graph.
      required:
        - nodeId
        - nodePosition
      properties:
        nodeId:
          type: string
        nodeDescriptor:
          type: string
        nodePosition:
          $ref: '#/components/schemas/NodePosition'

    GraphEdge:
      type: object
      description: A directed edge within a navigation graph.
      required:
        - edgeId
        - startNodeId
        - endNodeId
      properties:
        edgeId:
          type: string
        edgeDescriptor:
          type: string
        startNodeId:
          type: string
          description: Identifier of the start node of the edge.
        endNodeId:
          type: string
          description: Identifier of the end node of the edge.
        orientation:
          type: number
          format: double
          minimum: -3.14159265359
          maximum: 3.14159265359
          description: Orientation of the mobile robot on the edge in radians.
        orientationType:
          type: string
          enum:
            - GLOBAL
            - TANGENTIAL
        length:
          type: number
          format: double
          description: Distance of the path from start node to end node in meters.
        maximumSpeed:
          type: number
          format: double
          description: Permitted maximum speed on the edge in meters per second.

    ZoneSetDetail:
      type: object
      description: Full detail of a zone set, including its zones.
      required:
        - zoneSetId
        - zones
      properties:
        zoneSetId:
          type: string
          description: Unique identifier of the zone set.
        zoneSetDescriptor:
          type: string
          description: Human-readable name or descriptor.
        zones:
          type: array
          description: Zones under this zone set.
          items:
            $ref: '#/components/schemas/Zone'

    ZoneSetList:
      type: object
      description: A list of zone sets for a map.
      required:
        - zoneSets
      properties:
        zoneSets:
          type: array
          example: []
          items:
            type: object
            properties:
              zoneSetId:
                type: string
                description: Unique identifier of the zone set.
              zoneSetDescriptor:
                type: string
                description: Human-readable name or descriptor.
              zoneCount:
                type: integer
                format: int64
                minimum: 0
                description: Number of zones in the zone set.

    ZoneList:
      type: object
      description: A paginated list of zones.
      required:
        - zones
        - pagination
      properties:
        zones:
          type: array
          example: []
          items:
            $ref: '#/components/schemas/Zone'
        pagination:
          $ref: '#/components/schemas/Pagination'

    Zone:
      type: object
      description: |-
        Zone following the VDA 5050 zoneSet schema. The base fields
        (`zoneId`, `zoneType`, `vertices`, `zoneSetId`, `zoneSetDescriptor`)
        are always present. Zone-type-specific conditional fields
        (`releaseLossBehavior`, `maximumSpeed`, `entryActions`,
        `duringActions`, `exitActions`, `priorityFactor`, `penaltyFactor`,
        `direction`, `directedLimitation`, `bidirectedLimitation`) are
        modeled as optional and are not enforced with `if/then` constraints at
        the contract level.

        Per the VDA 5050 zoneSet schema, the following fields are required
        depending on `zoneType`:
        - `RELEASE`: `releaseLossBehavior`
        - `SPEED_LIMIT`: `maximumSpeed`
        - `ACTION`: `entryActions`, `duringActions`, `exitActions`
        - `PRIORITY`: `priorityFactor`
        - `PENALTY`: `penaltyFactor`
        - `DIRECTED`: `direction`, `directedLimitation`
        - `BIDIRECTED`: `direction`, `bidirectedLimitation`

        Clients and servers should enforce these requirements at the
        application layer.

        `zoneSetId` and `zoneSetDescriptor` are context fields sourced from
        the VDA 5050 zoneSet wrapper object, providing the zone set grouping
        that this zone belongs to.
      required:
        - zoneId
        - zoneType
        - vertices
      properties:
        zoneId:
          type: string
          description: Locally unique zone identifier within the zone set.
          example: zone-001
        zoneType:
          $ref: '#/components/schemas/ZoneType'
        zoneDescriptor:
          type: string
          description: User-defined, human-readable name or descriptor.
          example: Release zone at dock A
        zoneSetId:
          type: string
          description: |-
            Globally unique identifier of the zone set that this zone belongs
            to, sourced from the VDA 5050 zoneSet object.
          examples: [3F-Warehouse-Zones]
        zoneSetDescriptor:
          type: string
          description: |-
            Human-readable name or descriptor of the zone set that this zone
            belongs to, sourced from the VDA 5050 zoneSet object.
          examples: [3rd Floor Warehouse Zones]
        vertices:
          type: array
          minItems: 3
          description: Vertices defining the geometrical shape of the zone.
          example:
            - x: 0.0
              y: 0.0
            - x: 10.0
              y: 0.0
            - x: 10.0
              y: 10.0
            - x: 0.0
              y: 10.0
          items:
            $ref: '#/components/schemas/Vertex'
        releaseLossBehavior:
          type: string
          description: Required for `RELEASE` zones. Behavior if the release expires or is revoked.
          example: STOP
          enum:
            - STOP
            - CONTINUE
            - EVACUATE
        maximumSpeed:
          type: number
          format: double
          description: Required for `SPEED_LIMIT` zones. Maximum allowed speed in meters per second.
          example: 1.5
        entryActions:
          type: array
          description: Required for `ACTION` zones. Actions executed when entering the zone.
          example:
            - actionId: engage-cargo-lock
              actionType: ENGAGE_CARGO_LOCK
              blockingType: HARD
          items:
            $ref: '#/components/schemas/Action'
        duringActions:
          type: array
          description: Required for `ACTION` zones. Actions executed while crossing the zone.
          example:
            - actionId: transfer-cargo
              actionType: TRANSFER_CARGO
              blockingType: SOFT
          items:
            $ref: '#/components/schemas/Action'
        exitActions:
          type: array
          description: Required for `ACTION` zones. Actions triggered when leaving the zone.
          example:
            - actionId: release-cargo-lock
              actionType: RELEASE_CARGO_LOCK
              blockingType: HARD
          items:
            $ref: '#/components/schemas/Action'
        priorityFactor:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Required for `PRIORITY` zones. Relative preference factor.
          example: 0.8
        penaltyFactor:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Required for `PENALTY` zones. Relative penalty factor.
          example: 0.2
        direction:
          type: number
          format: double
          description: Required for `DIRECTED` and `BIDIRECTED` zones. Preferred direction of travel in radians.
          example: 1.5708
        directedLimitation:
          type: string
          description: Required for `DIRECTED` zones. Strictness of the direction constraint.
          example: RESTRICTED
          enum:
            - SOFT
            - RESTRICTED
            - STRICT
        bidirectedLimitation:
          type: string
          description: Required for `BIDIRECTED` zones. Strictness of the bidirectional constraint.
          example: SOFT
          enum:
            - SOFT
            - RESTRICTED

    Vertex:
      type: object
      description: Vertex of a zone polygon, following the VDA 5050 zoneSet schema.
      required:
        - x
        - y
      properties:
        x:
          type: number
          format: double
          description: X coordinate in meters.
        y:
          type: number
          format: double
          description: Y coordinate in meters.

    FleetOverview:
      type: object
      description: Aggregate overview of the fleet across sites.
      required:
        - robotCount
        - onlineRobotCount
        - activeOrderCount
        - queuedOrderCount
        - updatedAt
        - siteId
      properties:
        robotCount:
          type: integer
          format: int32
          minimum: 0
          examples: [12]
        onlineRobotCount:
          type: integer
          format: int32
          minimum: 0
          examples: [10]
        activeOrderCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of orders currently in the `RUNNING` state.
          examples: [7]
        queuedOrderCount:
          type: integer
          format: int32
          minimum: 0
          description: Number of orders currently in the `QUEUED` state.
          examples: [5]
        updatedAt:
          type: string
          format: date-time
          examples: ['2026-07-29T09:30:00Z']
        siteId:
          type: string
          description: Site identifier.
          examples: [site-warehouse-a]
