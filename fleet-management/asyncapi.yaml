asyncapi: 3.0.0
info:
  title: SyriusOrbit Fleet Management WebSocket API
  version: 1.0.0
  description: |
    AsyncAPI definition of the SyriusOrbit Fleet Management WebSocket API.
    This specification models real-time MQTT message streaming from the
    Fleet Control API to browser clients via WebSocket with dynamic
    filtering support.

    All VDA5050 MQTT topics are forwarded to WebSocket clients. Clients can
    dynamically update filter conditions (robotIds, siteIds, topics) without
    reconnecting. Filter conditions use replacement semantics: each subscribe
    message completely replaces the current filter set.

    See `requirements.md` for the full requirement specification.
defaultContentType: application/json
servers:
  websocketServer:
    host: '{host}:{port}'
    protocol: ws
    description: |
      WebSocket server for real-time MQTT message streaming. Same server
      as the Fleet Management HTTP API.
    variables:
      host:
        default: localhost
      port:
        default: '8080'
channels:
  subscribe:
    address: '/ws'
    description: |
      Client-to-server channel for subscribing to MQTT message streams.
      Sending a subscribe message replaces the current filter set.
      Send `{ "type": "subscribe", "filters": {} }` to receive all
      messages without filtering.
    messages:
      subscribeMessage:
        $ref: '#/components/messages/SubscribeMessage'

  message:
    address: '/ws'
    description: |
      Server-to-client channel for forwarding MQTT messages. All VDA5050
      MQTT messages are forwarded in real time, wrapped in a standard
      envelope with the original topic path and payload.
    messages:
      wsMessage:
        $ref: '#/components/messages/WsMessage'

operations:
  sendSubscribe:
    action: send
    channel:
      $ref: '#/channels/subscribe'
    summary: Client subscribes to MQTT message streams with filter conditions.
    description: |
      Client sends a subscribe message to update filter conditions.
      Uses replacement semantics: each message completely replaces the
      current filter set. All filter fields are optional.
    messages:
      - $ref: '#/channels/subscribe/messages/subscribeMessage'

  receiveMessage:
    action: receive
    channel:
      $ref: '#/channels/message'
    summary: Server forwards MQTT messages matching the current filter.
    description: |
      Server forwards MQTT messages wrapped in a standard envelope.
      The payload contains the original VDA5050 message without
      transformation. Messages are filtered according to the client's
      current subscribe conditions.
    messages:
      - $ref: '#/channels/message/messages/wsMessage'

components:
  messages:
    SubscribeMessage:
      name: subscribe
      title: Subscribe Message
      summary: Client-to-server message for updating WebSocket filter conditions.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribeMessage'

    WsMessage:
      name: message
      title: WebSocket Message
      summary: Server-to-client message carrying a forwarded MQTT message.
      contentType: application/json
      payload:
        $ref: '#/components/schemas/WsMessage'

  schemas:
    SubscribeMessage:
      type: object
      description: |
        Client-to-server message for updating WebSocket filter conditions.
        Uses replacement semantics: each subscribe message completely
        replaces the current filter set. Send `{ "type": "subscribe",
        "filters": {} }` to receive all messages without filtering.
      required:
        - type
        - filters
      properties:
        type:
          type: string
          enum:
            - subscribe
          description: Message type identifier. Must be `subscribe`.
        filters:
          $ref: '#/components/schemas/WsFilters'

    WsFilters:
      type: object
      description: |
        Filter conditions for WebSocket message streaming. All fields are
        optional. An empty object or omitted field means no filtering on
        that dimension (all values pass).
      properties:
        robotIds:
          type: array
          description: |
            Filter by robot identifier. Only forward messages from the
            specified robots. Robot identifier format:
            `{manufacturer}.{serialNumber}`.
          items:
            type: string
          example: ["Syrius.SOR-Carrier-001"]
        siteIds:
          type: array
          description: |
            Filter by site identifier. Only forward messages from robots
            affiliated with the specified sites.
          items:
            type: string
          example: ["site-warehouse-a"]
        topics:
          type: array
          description: |
            Filter by MQTT topic. Only forward messages matching the
            specified topics. Supported values follow VDA5050 topic names.
          items:
            $ref: '#/components/schemas/WsTopic'
          example: ["state", "connection"]

    WsTopic:
      type: string
      description: |
        VDA5050 MQTT topic name. Used as a filter condition in subscribe
        messages and as the topic identifier in forwarded messages.
      enum:
        - state
        - order
        - factsheet
        - connection
        - visualization
        - instantActions
        - zoneSet
        - responses

    WsMessage:
      type: object
      description: |
        Server-to-client message carrying a forwarded MQTT message.
        The `payload` field contains the original VDA5050 message payload
        without any transformation.
      required:
        - type
        - topic
        - payload
      properties:
        type:
          type: string
          enum:
            - message
          description: Message type identifier. Always `message`.
        topic:
          type: string
          description: |
            Full MQTT topic path of the forwarded message, for example
            `vda5050/v3/Syrius/SOR-Carrier-001/state`.
          example: "vda5050/v3/Syrius/SOR-Carrier-001/state"
        payload:
          type: object
          description: |
            Original VDA5050 message payload. The structure depends on the
            MQTT topic and follows the VDA5050 JSON schema specification:
            - `state`: state.schema
            - `order`: order.schema
            - `factsheet`: factsheet.schema
            - `connection`: connection.schema
            - `visualization`: visualization.schema
            - `instantActions`: instantActions.schema
            - `zoneSet`: zoneSet.schema
            - `responses`: responses.schema